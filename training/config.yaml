# AskWise on-device fine-tune config (RTX 5070 Ti 16GB + 32GB RAM friendly)

base_model: Qwen/Qwen2.5-1.5B-Instruct
# Same family as the packaged WebGPU wasm — after MLC convert we reuse that lib.
output_name: AskWise-PromptEngineer-1.5B

# Hugging Face destination for MLC weights (edit before push)
hf_repo: YOUR_HF_USER/AskWise-PromptEngineer-1.5B-q4f16_1-MLC

# Training
max_seq_len: 1536
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 2.0e-4
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
# QLoRA 4-bit — comfortable on 16GB; set false for full LoRA if VRAM allows
load_in_4bit: true

# Paths (relative to training/)
seed_jsonl: data/seed_sft.jsonl
train_jsonl: data/train_sft.jsonl
adapter_dir: output/lora_adapter
merged_dir: output/merged_hf
mlc_dir: output/mlc_q4f16_1
